<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Museum kitten peeking through a crooked gallery frame</title>

  <!-- A hand-cut gallery label: the offset coral edge keeps the mark visible on dark tabs. -->
  <path fill="#f06449" stroke="#172326" stroke-width="3" stroke-linejoin="round" d="M10 7 59 10 56 59 7 56Z"/>
  <path fill="#d9ee72" stroke="#172326" stroke-width="4" stroke-linejoin="round" d="M5 5 55 7 57 55 7 58Z"/>
  <path fill="#172326" stroke="#172326" stroke-width="3" stroke-linejoin="round" d="M10 11 51 10 53 51 11 55Z"/>

  <!-- The resident curator, simplified deliberately for a 16 px browser tab. -->
  <path fill="#f06449" stroke="#fffaf0" stroke-width="2" stroke-linejoin="round" d="m13 32 2-19 14 11 9-1 14-12-1 22Z"/>
  <path fill="#ff9f67" d="m19 23-1-5 7 6Zm24-1 6-6-1 8Z"/>
  <path fill="#f06449" stroke="#fffaf0" stroke-width="2" d="M12 34c1-10 9-16 20-16 12 0 21 7 21 18 0 12-9 18-21 18-12 0-21-7-20-20Z"/>

  <ellipse cx="25" cy="35" rx="5" ry="6" fill="#fffaf0"/>
  <ellipse cx="41" cy="35" rx="5" ry="6" fill="#fffaf0"/>
  <ellipse cx="26" cy="36" rx="2" ry="3" fill="#172326"/>
  <ellipse cx="40" cy="36" rx="2" ry="3" fill="#172326"/>
  <circle cx="25.5" cy="34.5" r=".8" fill="#fffaf0"/>
  <circle cx="39.5" cy="34.5" r=".8" fill="#fffaf0"/>

  <path fill="#fffaf0" d="M21 44c3-5 8-4 12-1 4-3 9-4 12 1-1 6-6 8-12 8s-11-2-12-8Z"/>
  <path fill="#8c79ff" stroke="#172326" stroke-width="1.5" stroke-linejoin="round" d="m30 43 3-2 3 2-3 3Z"/>

  <!-- Two paws overlap the frame, making the peeking pose unmistakable. -->
  <path fill="none" stroke="#d9ee72" stroke-width="4" stroke-linecap="round" d="m11 52 42-3"/>
  <ellipse cx="22" cy="51" rx="5" ry="3.5" fill="#ff9f67" stroke="#fffaf0" stroke-width="1.5" transform="rotate(-3 22 51)"/>
  <ellipse cx="44" cy="49.5" rx="5" ry="3.5" fill="#ff9f67" stroke="#fffaf0" stroke-width="1.5" transform="rotate(-3 44 49.5)"/>
</svg>
